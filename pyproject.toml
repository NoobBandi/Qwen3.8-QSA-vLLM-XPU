[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Qwen3.8-QSA-vLLM-XPU"
version = "0.1.0"
description = "vLLM plugin: Qwen3.8-27B-QSA sparse attention on Intel XPU (Arc Pro B70 / Xe2)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# Not declared here, so pip leaves an existing vLLM build alone: needs vllm
# 0.31.0 for XPU and vllm-xpu-kernels 0.1.17.1 (see README).
dependencies = []

[project.urls]
Source = "https://github.com/NoobBandi/Qwen3.8-QSA-vLLM-XPU"

[project.entry-points."vllm.general_plugins"]
qwen38_qsa = "qwen38_qsa:register"

[tool.setuptools.packages.find]
include = ["qwen38_qsa*"]

[tool.setuptools.package-data]
qwen38_qsa = ["draft_vocab.txt"]
